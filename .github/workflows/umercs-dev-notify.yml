name: uMercs dev repository notifications

# Trusted default-branch workflow. Read event metadata only; never check out PR code.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, closed]
  workflow_dispatch:
    inputs:
      mode:
        description: Connectivity check posts nothing; message sends a setup message.
        type: choice
        options: [connectivity, message]
        default: connectivity
permissions: {}
concurrency:
  group: dev-slack-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action || 'test' }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  notify:
    if: github.repository_owner == 'kevopsai' && github.event.repository.archived != true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Send scoped PR and main-push metadata to dev channel
        shell: python
        env:
          SLACK_DEV_WEBHOOK_URL: ${{ secrets.SLACK_DEV_WEBHOOK_URL }}
          NOTIFICATION_TEST_MODE: ${{ inputs.mode || 'connectivity' }}
        run: |
          import json,os,re,sys,urllib.request,urllib.error,urllib.parse
          
          def clean(value,limit=180):
              return str(value or '').replace('\r',' ').replace('\n',' ')[:limit].replace('&','&amp;').replace('<','&lt;').replace('>','&gt;')
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  raise urllib.error.HTTPError(req.full_url,code,'Redirect refused',headers,fp)
          
          def main():
              with open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8') as f:event=json.load(f)
              repo=event.get('repository',{});name=repo.get('full_name','')
              if not re.fullmatch(r'kevopsai/[A-Za-z0-9_.-]+',name,re.I) or repo.get('archived'):
                  print('Skipped: outside active kevopsai repositories');return
              url=os.environ.get('SLACK_DEV_WEBHOOK_URL','')
              try:
                  u=urllib.parse.urlsplit(url)
                  if u.scheme!='https' or u.hostname!='hooks.slack.com' or u.port not in (None,443) or u.username or u.password or u.query or u.fragment or not re.fullmatch(r'/services/[^/\s]+/[^/\s]+/[^/\s]+',u.path):raise ValueError()
              except ValueError:raise SystemExit('Missing or invalid Slack webhook secret') from None
              event_name=os.environ.get('GITHUB_EVENT_NAME')
              opener=urllib.request.build_opener(NoRedirect())
              if event_name=='workflow_dispatch' and os.environ.get('NOTIFICATION_TEST_MODE','connectivity')=='connectivity':
                  try:
                      with opener.open(urllib.request.Request(url,method='HEAD'),timeout=15) as response:status=response.status
                  except urllib.error.HTTPError as e:status=e.code
                  except Exception as e:raise SystemExit('Connectivity check failed: '+type(e).__name__) from None
                  if status not in (200,400,405):raise SystemExit('Connectivity check failed: HTTP '+str(status))
                  print('Secret configured; Slack endpoint reachable. No message posted.');return
              if event_name=='workflow_dispatch':
                  text='uMercs GitHub Actions notifications are connected for '+clean(name)+'. PR updates, merges, and main-branch updates will be sent here directly from GitHub.'
              elif event_name=='push':
                  if event.get('ref')!='refs/heads/main' or event.get('deleted') is True:
                      print('Skipped: not a live main-branch update');return
                  sha=event.get('after','')
                  if not isinstance(sha,str) or not re.fullmatch(r'[0-9a-fA-F]{40}',sha) or sha=='0'*40:
                      raise SystemExit('Invalid main-branch commit SHA')
                  actor=event.get('sender',{}).get('login') or os.environ.get('GITHUB_ACTOR') or 'GitHub'
                  commits=event.get('commits',[])
                  if not isinstance(commits,list):raise SystemExit('Invalid push commit list')
                  count=len(commits)
                  reported=event.get('size')
                  if type(reported) is int and reported>=count:count=reported
                  count_label=f'{count} commit'+('' if count==1 else 's')
                  if len(commits)>=2048 and count==len(commits):count_label=f'at least {count} commits'
                  if count==0:count_label='history update (no commits listed)'
                  head=event.get('head_commit') or {}
                  if not isinstance(head,dict):raise SystemExit('Invalid head commit metadata')
                  message=head.get('message','') if head.get('id') in (None,sha) else ''
                  subject=str(message or '').splitlines()[0] if str(message or '').splitlines() else 'Main updated'
                  forced=' | forced update' if event.get('forced') is True else ''
                  text=f'*Main updated*\n<https://github.com/{name}/commit/{sha}|{clean(name)} main @ {sha[:7]}>: {clean(subject)}\n{clean(actor,80)} | {count_label}{forced}'
              elif event_name=='pull_request_target':
                  action=event.get('action');pr=event.get('pull_request',{})
                  labels={'opened':'opened','synchronize':'updated','edited':'details updated','reopened':'reopened','closed':'closed'}
                  if action not in labels:print('Skipped: unconfigured PR action');return
                  number=pr.get('number')
                  if not isinstance(number,int) or number<=0:raise SystemExit('Invalid PR number')
                  label='merged' if action=='closed' and pr.get('merged') is True else labels[action]
                  actor=event.get('sender',{}).get('login') or event.get('actor') or 'GitHub'
                  head=pr.get('head',{}).get('ref','');base=pr.get('base',{}).get('ref','')
                  text=f'*PR {label}*\n<https://github.com/{name}/pull/{number}|{clean(name)} #{number}>: {clean(pr.get("title"))}\n{clean(actor,80)} | {clean(head,80)} → {clean(base,80)}'
              else:print('Skipped: unconfigured event');return
              request=urllib.request.Request(url,data=json.dumps({'text':text,'unfurl_links':False,'unfurl_media':False}).encode(),headers={'Content-Type':'application/json'},method='POST')
              # No automatic retries: a transport failure may have occurred after acceptance.
              try:
                  with opener.open(request,timeout=15) as response:
                      result=response.read(100).decode(errors='replace').strip();status=response.status
              except urllib.error.HTTPError as e:raise SystemExit('Slack rejected notification: HTTP '+str(e.code)) from None
              except Exception as e:raise SystemExit('Delivery outcome uncertain; inspect Slack before rerunning. Error class: '+type(e).__name__) from None
              if status!=200 or result!='ok':raise SystemExit('Slack did not confirm acceptance; inspect before rerunning')
              print('Slack accepted notification.')
          
          if __name__=='__main__':main()
